plugins {
    id 'java-library'
    alias(libs.plugins.java)
    id 'maven-publish'
    alias(libs.plugins.spring.dependency.management)
}

group = 'org.reallylastone'
version = file('version.txt').text.trim()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot.get()}"
    }
}

dependencies {
    api libs.spring.boot.starter.webmvc
    api libs.spring.boot.starter.security.oauth2.resource.server
    api libs.spring.boot.starter.data.jpa
    api libs.leader.election.lib
    api libs.spring.boot.starter.validation
    implementation libs.rsql.querydsl.spring.boot.starter
    implementation libs.springdoc.openapi.starter.webmvc.ui
    compileOnly libs.springdoc.openapi.starter.webmvc.ui
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testImplementation libs.junit.jupiter
    testImplementation libs.mockito.junit.jupiter
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
